<style>
:root{--navy:#1f2a44;--bg:#f3f5f9;--line:#e6e9ef;--text:#1f2a44;--sub:#6b7280;--blue:#2f5bff;--red:#d64545;--green:#178a5b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
header{background:var(--navy);color:#fff;padding:16px 14px 8px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:0 auto}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
.sync{font-size:12px;color:#cfd6e6;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block}
.sync.busy i{background:#facc15}.sync.err i{background:#f87171}
nav{display:flex;gap:4px;overflow-x:auto;margin:10px auto 0;max-width:680px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:transparent;border:0;color:#cfd6e6;font-size:15px;padding:9px 12px;border-radius:10px;font-weight:600;font-family:inherit;cursor:pointer}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
main{max-width:680px;margin:0 auto;padding:14px 14px 100px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.cap{font-size:13px;color:var(--sub)}
.big{font-size:34px;font-weight:800;letter-spacing:-.8px;margin:4px 0 2px}
.mid{font-size:22px;font-weight:800;letter-spacing:-.4px}
h3{margin:0;font-size:17px;letter-spacing:-.3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:2px}
.kpi .l{font-size:12.5px;color:var(--sub)}
.bar{height:10px;background:#eef1f6;border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-top:1px solid #f0f2f6;gap:10px;cursor:pointer}
.rows .row:first-child{border-top:0}
.row .n{font-weight:600;font-size:15px}
.row .d{font-size:12px;color:var(--sub);margin-top:2px}
.amt{font-weight:700;white-space:nowrap;font-size:15px}
.badge{font-size:11.5px;padding:3px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.b-확정{background:#e7f6ee;color:#178a5b}.b-진행중{background:#e8eeff;color:#2f5bff}.b-예상{background:#f1f2f5;color:#6b7280}
.pos{color:var(--green)}.neg{color:var(--red)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;color:var(--text);font-family:inherit;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.del{color:var(--red)}
.btn.full{width:100%}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;font-family:inherit;color:var(--text);cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini span{font-size:12px;background:#f4f6fa;border-radius:8px;padding:4px 8px;color:#374151}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:12px 0 6px;background:#eef1f6}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.memo{white-space:pre-wrap;font-size:14.5px;line-height:1.65;margin-top:8px;color:#374151}
.check{width:24px;height:24px;border-radius:50%;border:2px solid #cbd2de;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer}

.rows .goal:first-child{border-top:0}
.goal .body{flex:1;cursor:pointer}
.goal.done .t{text-decoration:line-through;color:var(--sub)}
.when{font-size:12px;color:var(--blue);font-weight:700}
.t{font-weight:700;font-size:15px;margin:2px 0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin-bottom:6px}
label.f{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}

textarea{min-height:160px;line-height:1.6}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .pri{flex:1}
.sum-live{margin-top:12px;padding:12px;border-radius:12px;background:#f4f6fa;display:flex;justify-content:space-between;font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.empty{color:var(--sub);font-size:14px;padding:10px 0}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:18px}
.foot a{color:var(--sub)}
svg text{font-family:inherit}

.flow{margin-top:14px;border-top:1px dashed #e1e5ec;padding-top:12px;cursor:default}
.fsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fsum div{background:#f6f8fb;border-radius:12px;padding:10px 12px}
.fsum span{display:block;font-size:12px;color:var(--sub)}
.fsum b{font-size:16px;font-weight:800;letter-spacing:-.3px}
.fbtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.fdet{margin-top:10px}
.fg{border:1px solid #eef0f4;border-radius:12px;padding:10px 12px;margin-top:8px}
.fg-h{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.fi{display:flex;justify-content:space-between;font-size:13px;color:#4b5563;padding:3px 0}
.src{font-size:12px;color:var(--sub);margin-top:8px}

.mv{display:flex;flex-direction:column;gap:2px}

.mv button:disabled{background:#f3f4f6;color:#d1d5db}
.frow.moved{animation:fl .5s}

.fgroup{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}

.addrow{margin-top:8px;padding:8px;font-size:13px}

</style>
</head>

/* ---------- utils ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function num(v){var n=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function ym(s){var m=String(s||'').match(/(\d{4})-(\d{2})/);return m?m[1].slice(2)+'.'+m[2]:''}

function grp(){var o={};S.budget.forEach(function(b){(o[b.group]=o[b.group]||[]).push(b)});var ks=Object.keys(o).sort(function(a,b){var ia=GROUP_ORDER.indexOf(a),ib=GROUP_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});return ks.map(function(k){return [k,o[k]]})}
function bsum(){var inc=0,sav=0,sp=0;S.budget.forEach(function(b){var a=num(b.amount);if(b.group==='소득')inc+=a;else if(b.group==='저축/투자')sav+=a;else sp+=a});return {inc:inc,sav:sav,sp:sp,left:inc-sav-sp}}
function goalKey(w){w=String(w||'');var y=(w.match(/\d{4}/)||['9999'])[0],m=w.match(/\d{4}[.\-](\d{1,2})/);var mm=m?('0'+m[1]).slice(-2):(/초/.test(w)?'02':/중/.test(w)?'06':/말/.test(w)?'11':'12');return y+mm}
/* ---------- 월별 수입·지출 ---------- */
function budgetRows(){return S.budget.map(function(b){return {group:b.group,name:b.name,amount:num(b.amount)}})}
function flowOf(r){var rows=S.flow.filter(function(x){return x.logId===r.id});
 if(rows.length)return {rows:rows,src:'rec'};
 if(r.status!=='확정')return {rows:budgetRows(),src:'budget'};

function flowGroups(rows){var o={};rows.forEach(function(x){(o[x.group]=o[x.group]||[]).push(x)});return Object.keys(o).sort(gOrder).map(function(k){return [k,o[k]]})}

 while((m=re.exec(n))){var t=m[1];if(/말일/.test(t))return 31;var d=t.match(/^\s*(\d{1,2})\s*일?\s*(?:,\s*\d{1,2}\s*일?\s*)*$/);if(d&&+d[1]>=1&&+d[1]<=31)return +d[1]}
 var e=n.match(/(\d{1,2})\s*일/);if(e&&+e[1]>=1&&+e[1]<=31)return +e[1];return 0}

 return h+'</div>'}

 GROUP_ORDER.concat(['기타 지출']).forEach(function(g){if(gs.indexOf(g)<0)gs.push(g)});

function chart(){
 var l=logSorted();if(l.length<2)return '<div class="empty">기록이 2개 이상이면 그래프가 나와요</div>';
 var W=360,H=200,pl=6,pr=6,pt=24,pb=22,n=l.length;
 var mx=0,mn=Infinity;l.forEach(function(r){mx=Math.max(mx,total(r),num(r.target));mn=Math.min(mn,total(r))});mx*=1.06;mn=Math.floor(mn*0.85);
 function X(i){return pl+i*(W-pl-pr)/(n-1)}function Y(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb)}
 var act=[],pre=[],tg=[],lastA=-1;
 l.forEach(function(r,i){var p=X(i).toFixed(1)+','+Y(total(r)).toFixed(1);if(r.status!=='예상'){act.push(p);lastA=i}});
 l.forEach(function(r,i){if(i>=lastA&&lastA>=0)pre.push(X(i).toFixed(1)+','+Y(total(r)).toFixed(1));if(num(r.target))tg.push(X(i).toFixed(1)+','+Y(num(r.target)).toFixed(1))});
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;margin-top:8px">';
 if(mx>10000){var y1=Y(10000);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y1+'" y2="'+y1+'" stroke="#d64545" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/><text x="'+(W-pr)+'" y="'+(y1-5)+'" text-anchor="end" font-size="10.5" fill="#d64545">1억</text>'}
 s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#e6e9ef"/>';
 if(tg.length)s+='<polyline points="'+tg.join(' ')+'" fill="none" stroke="#b6bfcc" stroke-width="1.6" stroke-dasharray="4 4"/>';
 if(pre.length>1)s+='<polyline points="'+pre.join(' ')+'" fill="none" stroke="#2f5bff" stroke-width="2.2" stroke-dasharray="5 4" opacity=".55"/>';
 if(act.length)s+='<polyline points="'+act.join(' ')+'" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linejoin="round"/>';
 var c=current(),ci=l.indexOf(c);if(ci>=0){var cx=X(ci),cy=Y(total(c));s+='<circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="#2f5bff" stroke="#fff" stroke-width="2"/><text x="'+Math.min(Math.max(cx,40),W-40)+'" y="'+(cy-12)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2a44">'+man(total(c))+'</text>'}
 var lr=l[n-1];s+='<circle cx="'+X(n-1)+'" cy="'+Y(total(lr))+'" r="4" fill="#2f5bff" opacity=".6"/>';
 s+='<text x="'+pl+'" y="'+(H-6)+'" font-size="10.5" fill="#6b7280">'+ym(l[0].start)+'</text>';
 if(ci>0&&ci<n-1)s+='<text x="'+X(ci)+'" y="'+(H-6)+'" font-size="10.5" fill="#2f5bff" text-anchor="middle">'+ym(c.start)+'</text>';
 s+='<text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="10.5" fill="#6b7280" text-anchor="end">'+ym(lr.start)+'</text></svg>';
 return s;
}

function field(label,name,val,type,extra){return '<div>'+field0(label,name,val,type,extra)+'</div>'}
function field0(label,name,val,type,extra){type=type||'text';
 if(type==='textarea')return '<label class="f">'+label+'</label><textarea name="'+name+'">'+esc(val)+'</textarea>';
 if(type==='select')return '<label class="f">'+label+'</label><select name="'+name+'">'+extra.map(function(o){return '<option'+(o===val?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
 if(type==='money')return '<label class="f">'+label+'</label><input name="'+name+'" inputmode="numeric" value="'+(val===''||val==null?'':num(val).toLocaleString('ko-KR'))+'" data-money>';
 return '<label class="f">'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(val)+'"'+(extra?' list="'+extra+'"':'')+'>';
}
function openSheet(title,body,onSave,onDel){
 modalOpen=true;var m=document.createElement('div');m.className='modal';
 m.innerHTML='<div class="sheet"><h3>'+title+'</h3><form>'+body+'<div class="acts">'+(onDel?'<button type="button" class="btn del" data-x="del">삭제</button>':'')+'<button type="button" class="btn" data-x="cancel">취소</button><button type="submit" class="btn pri">저장</button></div></form></div>';
 document.body.appendChild(m);
 var f=m.querySelector('form');
 function close(){m.remove();modalOpen=false}
 m.addEventListener('click',function(e){if(e.target===m)close();var x=e.target.getAttribute&&e.target.getAttribute('data-x');if(x==='cancel')close();if(x==='del'&&confirm('삭제할까요?')){onDel();close()}});
 f.addEventListener('input',function(e){if(e.target.hasAttribute('data-money')){var p=e.target.value.replace(/[^0-9\-]/g,'');e.target.value=p?Number(p).toLocaleString('ko-KR'):''}if(f.onlive)f.onlive()});
 f.addEventListener('submit',function(e){e.preventDefault();var o={};Array.prototype.forEach.call(f.elements,function(el){if(el.name)o[el.name]=el.hasAttribute('data-money')?(el.value===''?'':num(el.value)):el.value});onSave(o);close()});
 return f;
}
function upsert(k,obj){var a=S[k],i=-1;a.forEach(function(x,j){if(x.id===obj.id)i=j});if(i>=0)a[i]=obj;else a.push(obj);render();apiSave(k)}
function remove(k,id){S[k]=S[k].filter(function(x){return x.id!==id});render();apiSave(k)}
function byId(k,id){return S[k].filter(function(x){return x.id===id})[0]}

 if(el.hasAttribute('data-stop'))return;
 if(el.hasAttribute('data-tab')){tab=el.getAttribute('data-tab');render();window.scrollTo(0,0);return}
 if(el.hasAttribute('data-done')){var g=byId('goals',el.getAttribute('data-done'));g.done=g.done?'':'Y';render();apiSave('goals');return}
 if(el.hasAttribute('data-edit')){var k=el.getAttribute('data-edit'),id=el.getAttribute('data-id');
  if(k==='budget')editBudget(byId('budget',id));if(k==='log')editLog(byId('log',id));if(k==='goals')editGoal(byId('goals',id));if(k==='memo')editMemo(byId('memo',id));if(k==='plan')editPlan(el.getAttribute('data-year'));return}
 if(el.hasAttribute('data-year')&&!el.hasAttribute('data-edit')){yearFilter=el.getAttribute('data-year');render();return}
 if(el.hasAttribute('data-add')){var a=el.getAttribute('data-add');
  if(a==='budget'){var gname=el.getAttribute('data-group'),same=S.budget.filter(function(b){return b.group===gname})[0];editBudget({id:uid(),group:gname,account:same?same.account:'',name:'',amount:'',day:'',note:''},true)}
  if(a==='log'){var l=logSorted(),last=l[l.length-1]||{},n={id:uid(),start:last.end||'',end:addMonth(last.end||''),status:l.some(function(r){return r.status==='진행중'})?'예상':'진행중',memo:'',target:last.target?num(last.target)+400:''};CATS.forEach(function(c){n[c[0]]=num(last[c[0]])});editLog(n,true)}
  if(a==='goals')editGoal({id:uid(),when:'',age:'',title:'',amount:'',done:'',note:''},true);
  if(a==='memo')editMemo({id:uid(),title:'',body:''},true);
 }
});
load(true);
</script>
